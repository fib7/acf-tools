# Pre-commit hooks for Node.js/TypeScript projects
# Install: https://pre-commit.com/
# Usage: pre-commit install

# acf-whip: acfw-cycle hashes docs/cycles/ and commits it itself, so no hook may rewrite it.
# plan.md is bound to the exact bytes you approved and record.md is verified after each commit:
# a whitespace fixer or a markdown formatter that touches either one fails that commit.
exclude: '^docs/cycles/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        args: ['--write']
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.55.0
    hooks:
      - id: eslint
        args: ['--fix']
        types_or: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint
          - '@typescript-eslint/parser'
          - '@typescript-eslint/eslint-plugin'

  - repo: local
    hooks:
      - id: npm-build
        name: npm build (typecheck)
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true

      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true

# PARAMETERIZE: Customize based on your Node.js/TypeScript project needs
# - Replace 'npm' with 'pnpm' or 'yarn' as needed
# - Adjust build/test/lint scripts to match package.json
# - Add specific TypeScript checking (tsc --noEmit)
# - Add security auditing (npm audit)
# - Consider adding commitlint for commit message validation
