# Pre-commit hooks for Go projects
# Install: https://pre-commit.com/
# Usage: pre-commit install

# acf-whip: acfw-cycle hashes docs/cycles/ and commits it itself, so no hook may rewrite it.
# plan.md is bound to the exact bytes you approved and record.md is verified after each commit:
# a whitespace fixer or a markdown formatter that touches either one fails that commit.
exclude: '^docs/cycles/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.55.2
    hooks:
      - id: golangci-lint
        args: ['run', '--fix']

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt
        args: ['-w', '-s']
        language: system
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: go vet
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: 'go\.(mod|sum)$'

      - id: go-test
        name: go test
        entry: go test
        args: ['-v', './...']
        language: system
        pass_filenames: false
        stages: [pre-push]

# PARAMETERIZE: Customize based on your Go project needs
# - Add custom linters to golangci-lint args
# - Add security scanning (gosec)
# - Add vulnerability checking (govulncheck)
# - Adjust go test args for your test suite
